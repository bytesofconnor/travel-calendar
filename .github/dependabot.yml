version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /mcp/travel-calendar
    schedule:
      interval: weekly
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major, minor, patch]
    # Ignore typescript 7.x. typescript-eslint rejects TS 7.0, so pnpm lint exits 2.
    # https://github.com/typescript-eslint/typescript-eslint/issues/10940
    # https://github.com/bytesofconnor/travel-calendar/pull/28
    ignore:
      - dependency-name: "typescript"
        versions: ["7.x"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major, minor, patch]
