version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /mcp/travel-calendar
    schedule:
      interval: weekly
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major, minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major, minor, patch]
