name: Auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: automerge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    concurrency:
      group: automerge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Arm squash auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          if [ ! -f .github/policy/automerge-policy.mjs ]; then
            echo "Policy is not on the base branch yet."
            exit 0
          fi
          verdict=$(
            jq -n \
              --arg headRepo "$HEAD_REPO" \
              --arg baseRepo "$BASE_REPO" \
              --argjson draft "$DRAFT" \
              --argjson policyOnBase true \
              '{headRepo:$headRepo, baseRepo:$baseRepo, draft:$draft, policyOnBase:$policyOnBase}' \
              | node .github/policy/automerge-policy.mjs arm
          )
          action=$(printf '%s' "$verdict" | jq -r '.action')
          if [ "$action" != "arm" ]; then
            exit 0
          fi
          armed=$(gh pr view "$PR_URL" --json autoMergeRequest --jq 'if .autoMergeRequest == null then "no" else "yes" end')
          if [ "$armed" = "yes" ]; then
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
