name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Public Convex client URL already shipped in the production bundle.
      # Required at build time so / renders the login screen in smoke tests.
      NEXT_PUBLIC_CONVEX_URL: https://bright-mouse-917.convex.cloud
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prove PR body check rejects a missing section
        run: |
          set -euo pipefail
          if .github/scripts/pr-body-check.sh <<'BODY'
          ## Summary
          x
          ## Verification
          x
          BODY
          then
            echo "PR body check accepted a body without Blast Radius." >&2
            exit 1
          fi

      - name: Prove PR body check accepts the three sections
        run: |
          set -euo pipefail
          .github/scripts/pr-body-check.sh <<'BODY'
          ## Summary
          x
          ## Verification
          x
          ## Blast Radius
          x
          BODY

      - name: Check this PR body
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" | .github/scripts/pr-body-check.sh

      - name: Test Vercel ignore build
        run: bash scripts/vercel-ignore-build.test.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Test auto-merge policy
        run: node --test .github/policy/automerge-policy.test.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test invite join return
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test lib/oauth-redirect.test.mts

      - name: Install MCP dependencies
        working-directory: mcp/travel-calendar
        run: pnpm install --frozen-lockfile

      - name: Test agent trip writes
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test convex/lib/agentTripBody.test.mts mcp/travel-calendar/server.test.mts

      - name: Lint
        run: pnpm lint

      - name: Check theme packs
        run: pnpm theme-packs:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test
        run: pnpm test:smoke
